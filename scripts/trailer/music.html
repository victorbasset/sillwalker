<!doctype html><meta charset="utf-8">
<script type="module">
// (it. 1565) décode un morceau de la bande originale (Opus) et le rend en WAV 16 bits stéréo pour scripts/trailer/make.py
const id = new URLSearchParams(location.search).get("id") || "rebord";
try {
  const ab = await (await fetch(`../../src/renderer/assets/music/${id}.opus`)).arrayBuffer();
  const buf = await new OfflineAudioContext(2, 1, 48000).decodeAudioData(ab);
  const n = buf.length, ch = [buf.getChannelData(0), buf.getChannelData(buf.numberOfChannels > 1 ? 1 : 0)];
  const out = new DataView(new ArrayBuffer(44 + n * 4)), w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); out.setUint32(4, 36 + n * 4, true); w(8, "WAVEfmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true);
  out.setUint16(22, 2, true); out.setUint32(24, buf.sampleRate, true); out.setUint32(28, buf.sampleRate * 4, true);
  out.setUint16(32, 4, true); out.setUint16(34, 16, true); w(36, "data"); out.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) for (let c = 0; c < 2; c++) out.setInt16(44 + i * 4 + c * 2, Math.max(-32768, Math.min(32767, Math.round(ch[c][i] * 32767))), true);
  const bytes = new Uint8Array(out.buffer); let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  window.__wav = btoa(s); document.title = "READY";
} catch (e) { document.title = "ERROR " + e.message; }
</script>
