<!doctype html><meta charset="utf-8"><title>studio</title>
<script type="module">
// Page cachée du rendu (scripts/music/render.cjs) : rend un morceau de scripts/music/tracks/ hors temps réel et écrit
// un WAV 24 bits, 48 kHz, à côté du chemin demandé.
import { Studio, wav24 } from "./engine.js";
const q = new URLSearchParams(location.search), name = q.get("track"), out = q.get("out");
try {
  const track = (await import(`./tracks/${name}.js`)).default;
  const sr = 48000, len = Math.ceil((track.bars * 240 / track.bpm + (track.tail ?? 4)) * sr);
  const ctx = new OfflineAudioContext(2, len, sr);
  const st = new Studio(ctx, { bpm: track.bpm });
  await track.render(st);
  st.applyDucking();
  const t0 = performance.now(), buf = await ctx.startRendering();
  let peak = 0, sum = 0, nan = 0;
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) { const v = d[i]; if (v !== v) { nan++; continue; } const a = Math.abs(v); if (a > peak) peak = a; sum += v * v; } }
  require("fs").writeFileSync(out, wav24(buf));
  document.title = "DONE " + JSON.stringify({ seconds: +(len / sr).toFixed(1), renderMs: Math.round(performance.now() - t0), peak: +peak.toFixed(3), rmsDb: +(10 * Math.log10(sum / (2 * len) + 1e-12)).toFixed(1), nan });
} catch (e) { document.title = "ERROR " + (e && e.stack || e); }
</script>
