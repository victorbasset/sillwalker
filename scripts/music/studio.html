<!doctype html><meta charset="utf-8"><title>studio</title>
<script type="module">
// Page cachée du rendu (scripts/music/render.cjs) : rend un morceau de scripts/music/tracks/ hors temps réel et écrit
// un WAV 24 bits, 48 kHz, à côté du chemin demandé.
import { Studio, wav24 } from "./engine.js";
const q = new URLSearchParams(location.search), name = q.get("track"), out = q.get("out");
try {
  const track = (await import(`./tracks/${name}.js`)).default;
  const sr = 48000, len = Math.ceil((track.bars * 240 / track.bpm + (track.tail ?? 4)) * sr);
  const stems = q.get("stems") === "1", NCH = stems ? 18 : 2;
  const ctx = new OfflineAudioContext(NCH, len, sr);
  let merger = null;
  if (stems) { ctx.destination.channelCount = NCH; ctx.destination.channelInterpretation = "discrete"; merger = ctx.createChannelMerger(NCH); merger.connect(ctx.destination); }
  const st = new Studio(ctx, { bpm: track.bpm, stems: merger });
  await track.render(st);
  st.applyDucking();
  const t0 = performance.now(); let buf = await ctx.startRendering();
  if (stems) { // une piste mono par fichier (WAV 24 bits, recopiée sur deux canaux), et la liste des noms
    for (let k = 0; k < st.stemNames.length; k++) { const d = buf.getChannelData(2 + k), b = new AudioBuffer({ numberOfChannels: 2, length: d.length, sampleRate: sr }); b.getChannelData(0).set(d); b.getChannelData(1).set(d); require("fs").writeFileSync(out.replace(/\.wav$/, `.stem-${st.stemNames[k]}.wav`), wav24(b)); }
    const mix = new AudioBuffer({ numberOfChannels: 2, length: buf.length, sampleRate: sr }); mix.getChannelData(0).set(buf.getChannelData(0)); mix.getChannelData(1).set(buf.getChannelData(1)); buf = mix;
  }
  // Morceau en boucle (track.loop) : la queue après la dernière mesure (réverbération, écho, notes tenues) est repliée
  // sur le début, puis le fichier est coupé pile à la fin de la dernière mesure : la boucle s'enchaîne sans couture.
  if (track.loop) {
    const L = Math.round(track.bars * 240 / track.bpm * sr), out = new AudioBuffer({ numberOfChannels: 2, length: L, sampleRate: sr });
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c), o = out.getChannelData(c); o.set(d.subarray(0, L)); for (let i = L; i < d.length && i - L < L; i++) o[i - L] += d[i]; }
    buf = out;
  }
  let peak = 0, sum = 0, nan = 0;
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) { const v = d[i]; if (v !== v) { nan++; continue; } const a = Math.abs(v); if (a > peak) peak = a; sum += v * v; } }
  const total = buf.length;
  require("fs").writeFileSync(out, wav24(buf));
  document.title = "DONE " + JSON.stringify({ seconds: +(total / sr).toFixed(1), renderMs: Math.round(performance.now() - t0), peak: +peak.toFixed(3), rmsDb: +(10 * Math.log10(sum / (2 * total) + 1e-12)).toFixed(1), nan, loop: !!track.loop });
} catch (e) { document.title = "ERROR " + (e && e.stack || e); }
</script>
