<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'">
<title>Sillwalker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="edge-bottom mode-strip">
<div id="root">
  <div id="panel-wrap">
    <div id="panel" class="hit" role="region" aria-label="Panneau de gestion"></div>
  </div>
  <div id="toast" class="hit" role="status" hidden></div>
  <div id="strip" role="img" aria-label="Le héros traverse la zone et combat">
    <button id="hud-tab" class="hit" aria-label="Ouvrir le panneau de gestion" title="Ouvrir le panneau (héros, sac, zone)"></button>
    <div class="strip-btns">
      <button id="sound-btn" class="hit sbtn snd" title="Couper le son" aria-label="Couper le son"><svg class="ico-snd" viewBox="0 0 12 10" aria-hidden="true" shape-rendering="crispEdges"><path class="spk" d="M0 3h3l3-3v10L3 7H0z"/><path class="waves" d="M8 3h1v4H8zM10 1h1v8h-1z"/><path class="cross" d="M7 3h1v1H7zM8 4h1v1H8zM9 5h1v1H9zM10 6h1v1h-1zM10 3h1v1h-1zM9 4h1v1H9zM8 5h1v1H8zM7 6h1v1H7z"/></svg></button>
      <button id="mini-btn" class="hit sbtn" title="Réduire en mode mini" aria-label="Réduire en mode mini"><span class="ico-min" aria-hidden="true"></span></button>
      <button id="menu-btn" class="hit sbtn" title="Ouvrir le panneau (héros, sac, zone)" aria-label="Ouvrir le panneau de gestion" aria-expanded="false">
        <span class="chev" aria-hidden="true"></span><span id="menu-badge" class="badge" hidden></span>
      </button>
    </div>
  </div>
</div>
<div id="mini" class="hit" hidden title="Cliquer pour agrandir">
  <div class="mini-btns">
    <button id="mini-sound" class="sbtn snd" title="Couper le son" aria-label="Couper le son"><svg class="ico-snd" viewBox="0 0 12 10" aria-hidden="true" shape-rendering="crispEdges"><path class="spk" d="M0 3h3l3-3v10L3 7H0z"/><path class="waves" d="M8 3h1v4H8zM10 1h1v8h-1z"/><path class="cross" d="M7 3h1v1H7zM8 4h1v1H8zM9 5h1v1H9zM10 6h1v1h-1zM10 3h1v1h-1zM9 4h1v1H9zM8 5h1v1H8zM7 6h1v1H7z"/></svg></button>
    <button id="mini-icon" class="sbtn" title="Réduire en icône (zone de notification)" aria-label="Réduire en icône"><span class="ico-min" aria-hidden="true"></span></button>
    <button id="mini-expand" class="sbtn" title="Agrandir en bande" aria-label="Agrandir en bande"><span class="ico-max" aria-hidden="true"></span></button>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
