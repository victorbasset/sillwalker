[package]
name = "sillwalker-proto"
version = "0.1.0"
edition = "2021"
description = "Essai : la bande de Sillwalker sous Tauri (mesures mémoire et processeur)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
