# Essai Tauri (demande de Victor) : compile la bande du jeu sous Tauri sur une machine Windows de GitHub
# et dépose l'exécutable dans l'onglet « Actions » du dépôt (artefact « sillwalker-tauri-essai »).
name: Essai Tauri (Windows)
on:
  push:
    paths: ["proto-tauri/**", ".github/workflows/proto-tauri.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proto-tauri/src-tauri
      - name: Pages du jeu
        run: node proto-tauri/build-web.mjs
      - name: Icônes
        run: npx --yes @tauri-apps/cli@2 icon build/icon.png -o proto-tauri/src-tauri/icons
      - name: Compilation
        working-directory: proto-tauri
        run: npx --yes @tauri-apps/cli@2 build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: sillwalker-tauri-essai
          path: proto-tauri/src-tauri/target/release/sillwalker-proto.exe
